name: grass goat

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - grass_pets.py
      - .github/workflows/grass-goat.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python grass_pets.py ${{ github.repository_owner }} dist
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
